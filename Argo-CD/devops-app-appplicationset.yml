apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-app-applicationset
  namespace: argocd
spec:
  generators:
    - list:
        elements:

          - order: "1"
            name: prod-devops-app
            values_file: prod-values.yml
            cluster_name: eks-prod
            namespace: 'devops-app'
            autosync: false

          - order: "2"
            name: staging-devops-app
            values_file: test-values.yml
            cluster_name: eks-prod
            namespace: 'staging-devops-app'
            autosync: true
            
          - order: "3"
            name: dev-devops-app
            values_file: dev-values.yml
            cluster_name: kops-dev
            namespace: 'devops-app'
            autosync: true
          


  goTemplate: true 

  template:
    metadata:
      name: '{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "{{order}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/Youssef11gaber10/Cloud-Native-DevOps-Platform.git
        path: 'Helm/app-charts/devops-app'
        targetRevision: main
        helm:
          releaseName: devops-app-release
          valueFiles:
            - '{{values_file}}'
      destination:
        name: '{{cluster_name}}'
        # namespace: 'devops-app'
        namespace: '{{namespace}}'

      {{ if .autosync }}
      syncPolicy:
        automated: 
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=false
      {{ end }}
          

apiVersion: argoproj.io/v1alpha1 
kind: Application 
metadata: 
  name: monitoring-apps
  namespace: argocd  
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec: 
  project: default 

  source: 
    repoURL: https://github.com/Youssef11gaber10/Cloud-Native-DevOps-Platform.git
    path: ./K8S/monitoring

    targetRevision: main  

  destination: # eks cluster
    name: eks-prod
    namespace: monitoring


  syncPolicy: 
    # manual:  # (manual approval) CD contionus Delivery
    automated: # CD continous deployment (no manual appro)
      selfHeal: true  
      prune: true 
    syncOptions:
      - CreateNamespace=false 

      
apiVersion: v1
kind: ResourceQuota
metadata:
  name: logging-quota
  namespace: logging

spec:
  hard:
    # CPU
    requests.cpu: "1"
    limits.cpu: "6"

    # Memory
    requests.memory: 2500Mi
    limits.memory: 5000Mi

    # Storage
    requests.storage: 30Gi

    # Objects
    pods: "25"
    services: "15"
    configmaps: "30"
    secrets: "30"

    # Persistent Volumes
    persistentvolumeclaims: "5"
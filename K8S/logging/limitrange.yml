apiVersion: v1
kind: LimitRange
metadata:
  name: logging-limits
  namespace: logging

spec:
  limits:
  - type: Container

    defaultRequest:
      cpu: 50m
      memory: 64Mi

    default:
      cpu: 200m
      memory: 256Mi

    min:
      cpu: 25m
      memory: 32Mi

    max:
      cpu: 1000m
      memory: 1Gi
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devops-app-quota
  namespace: devops-app
spec:
  hard:
    # CPU
    requests.cpu: "2"        # 2000m total requests across all pods
    limits.cpu: "4"          # 4000m total limits across all pods

    # Memory
    requests.memory: 2Gi
    limits.memory: 4Gi

    # Storage
    requests.storage: 30Gi

    # Objects
    pods: "25"
    services: "15"
    configmaps: "50"
    secrets: "50"

    # Persistent Volumes
    persistentvolumeclaims: "5"
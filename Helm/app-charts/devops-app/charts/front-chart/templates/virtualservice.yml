apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devops-app-vs

spec:
  gateways:
    - devops-app-gateway

  hosts:
    - devops-app.mycloudlab.website

  http:
    - match:
        - uri:
            prefix: /api
      rewrite:
        uriRegexRewrite:
          match: '^/api(/.*)?$'
          rewrite: '\1'
      route:
        - destination:
            host: {{ .Values.global.backend_host }}
            port:
              number: 5000
  
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Values.global.frontend_host }}
            port:
              number: 8080